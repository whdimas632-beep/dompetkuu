
name: Build Dompetku APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatatanPengeluaranAndroid.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Ekstrak project
        run: |
          unzip -q CatatanPengeluaranAndroid.zip -d project

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build AP
