
name: Build Dompetku APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatatanPengeluaranAndroid.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Ekstrak project
        run: |
          unzip -q CatatanPengeluaranAndroid.zip -d project
          find project -name settings.gradle.kts

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")

          if [ "$PROJECT_DIR" = "." ] || [ -z "$PROJECT_DIR" ]; then
            echo "Project Android tidak ditemukan"
            exit 1
          fi

          gradle -p "$PROJECT_DIR" assembleDebug

          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/Dompetku.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Dompetku-APK
          path: output/Dompetku.apk
