
name: Build Dompetku APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatatanPengeluaranAndroid.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Ekstrak project
        run: |
          unzip -q CatatanPengeluaranAndroid.zip -d project

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cari project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Samakan Java dan Kotlin
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace(
              '    buildFeatures { compose = true }',
              '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }'''
          )
          open(p, 'w').write(s)
          PY

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/Dompetku.apk

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Dompetku-APK
          path: output/Dompetku.apk
          
